app = "epic-proxy-darmstadt"
primary_region = "fra"

[build]
  builder = "heroku/buildpacks:20"

[[services]]
  internal_port = 19132
  protocol = "udp"
  auto_stop_machines = false
  auto_start_machines = true

  [[services.ports]]
    port = 19132

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
